[package]
name = "batopoc-gpui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native-client proof of concept for bato-template, built on GPUI (Zed's UI framework)."

[[bin]]
name = "batopoc-gpui"
path = "src/main.rs"

[dependencies]
# GPUI as published by the gpui-component maintainers: a crates.io snapshot of
# zed-industries/zed@d2a4fb6ded7c470be25d1541281da3882495b65b (Nov 2026).
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11"] }
bato-theme = { path = "../bato-theme" }
scroll-physics = { path = "../scroll-physics" }
serde_json = "1"
libc = "0.2"
unicode-segmentation = "1"

# Wayland `axis_stop` → `TouchPhase::Ended` (gesture end for touchpad fling).
# See README.md and patches/gpui-linux-wayland-axis-stop.diff; create the
# checkout with scripts/setup-gpui-patch.sh.
[patch.crates-io]
gpui-pre-linux = { path = "../../../../../.cache/bato-native/gpui-pre-linux-0.3.12" }
gpui-pre = { path = "../../../../../.cache/bato-native/gpui-pre-0.3.12" }
gpui-pre-wgpu = { path = "../../../../../.cache/bato-native/gpui-pre-wgpu-0.3.12" }

[profile.release]
# Size-tuned: 19.6 MB instead of 31 MB (thin LTO, opt-level 3), ~6 MB less PSS,
# same first-frame time and frame pacing.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
