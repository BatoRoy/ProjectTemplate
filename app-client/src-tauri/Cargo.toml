# Tauri shell for the template's React frontend. See src/main.rs for how it
# relates to electron/main.js, and README.md in this directory for the spike's
# findings and what is still Phase 1.

[package]
name = "app"
# The real version lives in frontend/package.json (synced by version.sh);
# tauri.conf.json points `version` at it, so Cargo's is a placeholder.
version = "0.0.0"
edition = "2021"
rust-version = "1.77.2"
description = "Desktop client (Tauri flavor)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The main-process HTTP proxy behind electronAPI.apiRequest. rustls so the
# AppImage does not depend on the host's OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Only to reach WebKitGTK's settings object (smooth scrolling, see main.rs);
# the version is whatever wry already pulls in, so this adds no new crate.
webkit2gtk = "2.0"

[profile.release]
# Size-leaning like the Tauri template, but thin LTO: fat LTO roughly doubles
# the link step for a few percent of binary size, which is the wrong trade for
# a template people iterate on.
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
