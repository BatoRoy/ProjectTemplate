name: Release

# The QML flavor's release workflow. new-app.sh keeps this one and deletes
# release-electron.yml (or the reverse) — one workflow per app, matching its client.
#
# There is no packaging step for the UI: the QML ships as source text and the system
# qml6 parses it at runtime. So this builds two Go binaries and uploads a tarball with
# the same layout `make stage-qml` produces, which is also the layout `bato install`
# expects.
#
# Note what CI cannot do here: `bato publish` needs the suite's MinIO credentials and
# LAN registry, so publishing stays a local `make publish-qml`. This workflow produces
# a GitHub release for people outside the LAN, and — more usefully day to day — it is
# what catches a QML error before a tag becomes a release.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # qmllint and qmltestrunner live in the Qt 6 declarative package. The
      # unsuffixed /usr/bin/qmllint on some distros belongs to Qt 5 and will happily
      # accept Qt 6 QML it cannot analyse, so the Makefile resolves the Qt 6 bin dir
      # through qmake6 rather than trusting PATH.
      - name: Install Qt 6 QML tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-shapes \
            qml6-module-qtquick-effects qml6-module-qtquick-dialogs \
            qml6-module-qtcore libqt6svg6

      - name: go vet
        run: |
          cd app-server && go vet ./...
          cd ../app-client-qml && go vet ./...

      - name: qmllint
        run: make lint-qml

      - name: Go tests
        run: |
          cd app-server && go test ./...
          cd ../app-client-qml && go test ./...

      # Offscreen so it needs no display. Asserts the contrast contract holds for
      # every theme preset against every accent preset.
      - name: QML tests
        run: make test-qml

  release:
    name: Build and release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Reuses the same target the local publish uses, so what CI uploads and what
      # `make publish-qml` uploads cannot differ in layout. Node is present on the
      # runner already, which stage-qml needs for the manifest.
      - name: Stage the release
        run: make stage-qml

      - name: Verify the manifest
        run: node tools/check-desktop-manifest.mjs deploy/desktop

      - name: Build Windows server binary
        run: |
          cd app-server
          GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" \
            -o ../dist/app-server-windows-amd64.exe .

      - name: Create the tarball
        run: |
          tar -czf "dist/qml-client-${{ steps.version.outputs.version }}-linux-amd64.tar.gz" \
            -C deploy/desktop .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/qml-client-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            dist/app-server-linux-amd64
            dist/app-server-windows-amd64.exe
