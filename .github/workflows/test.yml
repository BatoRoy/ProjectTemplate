name: Test

# Runs on every push and pull request — unlike the release workflow, which fires
# only on a v*.*.* tag. Before this existed nothing in the suite ran tests
# automatically, and BatoBrowse's only Go test sat failing for months without
# anyone noticing: it decoded /api/health into map[string]string after the
# handler started returning a bool field.
#
# Deliberately layout-agnostic. Repos in this suite disagree about directory
# names (app-server, backend, nem-remote; app-client/frontend, frontend,
# nem-client/frontend), so every job discovers what to run instead of hardcoding
# a path. That means this same file can be dropped into any repo unchanged.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go:
    name: Go — vet, race, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Modules in this suite live at varying depths (app-server, backend,
          # nem-remote), so there is no single go.mod to read a version from.
          # Pin a floor here; a module needing newer gets it from its own
          # toolchain directive.
          go-version: '1.25'
          cache: false

      - name: Find and check every Go module
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          found=0
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            ( cd "$dir" && go vet ./... && go build ./... && go test -race ./... )
            echo "::endgroup::"
            found=1
          done < <(find . -name go.mod -not -path '*/vendor/*' -not -path '*/node_modules/*' | sort)
          if [ "$found" -eq 0 ]; then echo "no Go modules — nothing to do"; fi

  frontend:
    name: Frontend — typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Find and check every frontend
        run: |
          set -euo pipefail
          found=0
          # Check any package that declares a "build" or a "typecheck" script.
          # That is every frontend plus the tsx-run services in bato/ (registry,
          # cli — neither builds a bundle, both typecheck), while skipping the
          # dependency-only and Electron-wrapper package.json files, which have
          # neither. A package whose only script is an Electron GUI test
          # (bato-hub) stays out on purpose: those need a display this runner
          # does not have.
          while IFS= read -r pkg; do
            dir=$(dirname "$pkg")
            node -e "const s = require('./$pkg').scripts || {}; process.exit(s.build || s.typecheck ? 0 : 1)" || continue
            echo "::group::$dir"
            (
              cd "$dir"
              if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
              # Each step runs only if the repo actually defines it, so a repo
              # that has not adopted lint yet is not failed for that alone.
              npm run --if-present typecheck
              npm run --if-present lint
              # "test" is `vitest run` across the suite — already non-watch.
              npm run --if-present test
              npm run --if-present build
            )
            echo "::endgroup::"
            found=1
          done < <(find . -name package.json -not -path '*/node_modules/*' -not -path '*/dist/*' | sort)
          if [ "$found" -eq 0 ]; then echo "no frontends — nothing to do"; fi

  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Debug info dominates target/ size, and so the cache.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      # Every Cargo project with a committed lockfile (app-client-native in a
      # native app), outside build output.
      - name: Find Cargo projects
        id: find
        run: |
          set -euo pipefail
          dirs=$(find . -name Cargo.lock -not -path '*/target/*' -not -path '*/node_modules/*' -printf '%h\n' | sort)
          {
            echo "dirs<<EOF"; echo "$dirs"; echo "EOF"
            echo "cache<<EOF"; for d in $dirs; do echo "$d -> target"; done; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$dirs" ]; then echo "no Cargo projects — nothing to do"; fi

      - if: steps.find.outputs.dirs != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # FreeType is built from source (bato-kit's `bundled`); pkg-config finds zlib.
      - if: steps.find.outputs.dirs != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config zlib1g-dev

      - if: steps.find.outputs.dirs != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.find.outputs.cache }}
          key: test

      - name: Check every Cargo project
        if: steps.find.outputs.dirs != ''
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            echo "::group::$dir"
            # --all-features: optional code (the native client's bundled-server
            # supervisor) is linted and tested too.
            ( cd "$dir" && cargo fmt --all -- --check \
              && cargo clippy --locked --all-targets --all-features -- -D warnings \
              && cargo test --locked --all-features )
            echo "::endgroup::"
          done <<< "${{ steps.find.outputs.dirs }}"
