# The native client: Rust + iced on bato-native's kit (bato-kit) and platform
# shell (bato-shell). See CLIENT.md.

# A single-package workspace, so this manifest is the root: [patch] and the
# profiles below are only honoured there.
[workspace]

[package]
# Never stamped: renaming the package would rewrite Cargo.lock. The binary name
# (below) is what carries the app's identity.
name = "app-client"
# The real version comes from ../VERSION through build.rs (APP_VERSION), so
# version.sh never touches this file and Cargo.lock never churns.
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "app" # bin: stamped by new-app.sh
path = "src/main.rs"

[features]
default = []
# Spawn the bundled Go server (app-server) as a sidecar. Also add "app-server"
# to bato.json "artifacts" so `make stage-native` ships it. CLIENT.md.
bundled-server = ["bato-shell/supervisor"]

# Every bato-native line uses the same tag. `make native-bump TAG=vX.Y.Z` moves
# them together; `make lint` fails if they disagree.
[dependencies]
bato-kit = { git = "https://github.com/BatoRoy/bato-native", tag = "v0.2.0" }
bato-shell = { git = "https://github.com/BatoRoy/bato-native", tag = "v0.2.0" }
# The Showcase ("Examples") and Scroll lab pages. Drop it, with the two pages,
# when the app no longer wants them.
gallery = { git = "https://github.com/BatoRoy/bato-native", tag = "v0.2.0" }

[dev-dependencies]
serde_json = "1"

# The patched upstream crates (bato-native README, "Patched crates"). [patch]
# is honoured only in the root manifest, so every app carries this block.
[patch.crates-io]
winit = { git = "https://github.com/BatoRoy/bato-native", tag = "v0.2.0" }
cosmic-text = { git = "https://github.com/BatoRoy/bato-native", tag = "v0.2.0" }
cryoglyph = { git = "https://github.com/BatoRoy/bato-native", tag = "v0.2.0" }
iced_wgpu = { git = "https://github.com/BatoRoy/bato-native", tag = "v0.2.0" }

# Same profiles as bato-native.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# Keep the cache small (CI) and debug builds fast.
[profile.dev]
debug = "line-tables-only"

# wgpu, cosmic-text and resvg are unusably slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
debug = false
